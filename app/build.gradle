plugins {
    id 'com.android.application'
}

android {
    namespace 'org.palmstead.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'org.palmstead.launcher'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
